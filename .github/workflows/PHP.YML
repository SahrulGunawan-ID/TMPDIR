name: Build PHP Static (musl ARM64)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download musl toolchain (ARM64)
        run: |
          curl -L https://static-php-cli.fra1.digitaloceanspaces.com/static-php-cli/deps/musl-toolchain/aarch64-musl-toolchain.tgz \
            -o musl-toolchain.tgz
          tar -xzf musl-toolchain.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison re2c pkg-config \
            libxml2-dev libsqlite3-dev libssl-dev zlib1g-dev

      - name: Configure PHP static (ARM64)
        run: |
          ./configure \
            --enable-static --disable-shared \
            --enable-cli --disable-cgi \
            --without-pear \
            CC=aarch64-linux-musl-gcc \
            LDFLAGS="-static"

      - name: Build PHP
        run: make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-static-musl-arm64
          path: sapi/cli/php
