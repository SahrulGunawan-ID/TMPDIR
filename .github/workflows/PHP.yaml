name: Build PHP 8.3 Static ARM64

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download musl toolchain (ARM64)
        run: |
          curl -L https://static-php-cli.fra1.digitaloceanspaces.com/static-php-cli/deps/musl-toolchain/aarch64-musl-toolchain.tgz \
            -o musl-toolchain.tgz
          tar -xzf musl-toolchain.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison re2c pkg-config \
            libxml2-dev libsqlite3-dev libssl-dev zlib1g-dev curl tar xz p7zip-full

      - name: Download PHP source
        run: |
          curl -L https://www.php.net/distributions/php-8.3.11.tar.xz -o php.tar.xz
          tar -xf php.tar.xz
          mv php-8.3.11 php-src

      - name: Configure PHP static (ARM64)
        working-directory: php-src
        run: |
          ./configure \
            --enable-static --disable-shared \
            --enable-cli --disable-cgi \
            --without-pear \
            CC=aarch64-linux-musl-gcc \
            LDFLAGS="-static"

      - name: Build PHP
        working-directory: php-src
        run: make -j$(nproc)

      - name: Package build directory
        run: |
          tar -cvJf php-static-arm64.tar.xz php-src
          7z a php-static-arm64.7z php-src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-static-arm64-build
          path: |
            php-static-arm64.tar.xz
            php-static-arm64.7z

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: php-static-arm64-v8.3.11
          name: "PHP 8.3.11 Static ARM64 Build"
          files: |
            php-static-arm64.tar.xz
            php-static-arm64.7z
